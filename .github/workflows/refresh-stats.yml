name: refresh-stats

on:
  schedule:
    # каждые 6 часов меняем cache-bust в URL виджетов — они перерисовываются со свежими данными
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Обновляю параметр v= в URL динамических виджетов
        run: |
          python3 - <<'EOF'
          import re, datetime

          stamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%dT%H")
          targets = (
              "github-readme-stats.vercel.app",
              "streak-stats.demolab.com",
              "github-readme-activity-graph.vercel.app",
              "github-profile-trophy.vercel.app",
          )
          path = "README.md"
          text = open(path, encoding="utf-8").read()

          def bump(match):
              url = match.group(1)
              url = re.sub(r"[&?]v=[^&\"']*", "", url)  # старый stamp
              sep = "&" if "?" in url else "?"
              return f'src="{url}{sep}v={stamp}"'

          lines = []
          changed = False
          for line in text.splitlines():
              if any(t in line for t in targets):
                  new_line, n = re.subn(r'src="([^"]+)"', bump, line)
                  if n:
                      changed = True
                  lines.append(new_line)
              else:
                  lines.append(line)

          if changed:
              out = "\n".join(lines)
              if not out.endswith("\n"):
                  out += "\n"
              open(path, "w", encoding="utf-8").write(out)
              print(f"README.md: виджеты обновлены до v={stamp}")
          else:
              print("Изменений нет")
          EOF

      - name: Публикую
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "refresh stats (v=$(date -u +%Y%m%dT%H%M))"
            git push
          else
            echo "README не изменился, коммит не нужен"
          fi
