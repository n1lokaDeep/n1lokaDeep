<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1a1035"/>
      <stop offset="42%"  stop-color="#3b1d5e"/>
      <stop offset="72%"  stop-color="#7b2d6b"/>
      <stop offset="100%" stop-color="#c94f8a"/>
    </linearGradient>

    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ff9ecb" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff9ecb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7ad7ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7ad7ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#c9a2ff" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#c9a2ff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="45%"  stop-color="#ffd9ef"/>
      <stop offset="100%" stop-color="#a8e6ff"/>
    </linearGradient>

    <linearGradient id="lineFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ff9ecb" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ff9ecb" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7ad7ff" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="softText" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <!-- лепесток сакуры -->
    <path id="petal"
          d="M0,0 C5,-7 14,-9 18,-3 C22,3 18,13 9,16 C2,18 -3,12 -2,6 C-1.4,2.4 -1.6,3.4 0,0 Z"/>

    <style>
      @keyframes fallA {
        0%   { transform: translate(0, -60px) rotate(0deg);   opacity: 0; }
        12%  { opacity: .85; }
        88%  { opacity: .85; }
        100% { transform: translate(70px, 400px) rotate(320deg); opacity: 0; }
      }
      @keyframes fallB {
        0%   { transform: translate(0, -80px) rotate(0deg);   opacity: 0; }
        15%  { opacity: .7; }
        85%  { opacity: .7; }
        100% { transform: translate(-60px, 410px) rotate(-300deg); opacity: 0; }
      }
      @keyframes twinkle {
        0%, 100% { opacity: .25; }
        50%      { opacity: 1; }
      }
      @keyframes drift {
        0%, 100% { transform: translate(0, 0); }
        50%      { transform: translate(0, -10px); }
      }
      .p1 { animation: fallA 9s  linear infinite; }
      .p2 { animation: fallB 12s linear infinite; }
      .p3 { animation: fallA 14s linear infinite; }
      .p4 { animation: fallB 10.5s linear infinite; }
      .p5 { animation: fallA 16s linear infinite; }
      .s1 { animation: twinkle 2.6s ease-in-out infinite; }
      .s2 { animation: twinkle 3.4s ease-in-out .6s infinite; }
      .s3 { animation: twinkle 2.1s ease-in-out 1.1s infinite; }
      .s4 { animation: twinkle 3.9s ease-in-out .3s infinite; }
      .glowA { animation: drift 7s ease-in-out infinite; }
      .glowB { animation: drift 9s ease-in-out 1.2s infinite; }
    </style>
  </defs>

  <!-- фон -->
  <rect width="1200" height="340" rx="18" fill="url(#sky)"/>

  <!-- мягкие свечения -->
  <g class="glowA">
    <ellipse cx="200" cy="90"  rx="230" ry="150" fill="url(#glowA)" filter="url(#soft)"/>
  </g>
  <g class="glowB">
    <ellipse cx="1010" cy="270" rx="260" ry="160" fill="url(#glowB)" filter="url(#soft)"/>
    <ellipse cx="640"  cy="30"  rx="200" ry="120" fill="url(#glowC)" filter="url(#soft)"/>
  </g>

  <!-- звёзды -->
  <g fill="#ffffff">
    <circle class="s1" cx="120"  cy="52"  r="1.9"/>
    <circle class="s2" cx="322"  cy="34"  r="1.4"/>
    <circle class="s3" cx="505"  cy="66"  r="1.7"/>
    <circle class="s4" cx="742"  cy="28"  r="1.3"/>
    <circle class="s1" cx="905"  cy="58"  r="1.8"/>
    <circle class="s2" cx="1080" cy="40"  r="1.5"/>
    <circle class="s3" cx="1156" cy="96"  r="1.6"/>
    <circle class="s4" cx="60"   cy="122" r="1.3"/>
    <circle class="s1" cx="392"  cy="112" r="1.2"/>
    <circle class="s2" cx="846"  cy="120" r="1.4"/>
    <circle class="s3" cx="660"  cy="96"  r="1.1"/>
    <circle class="s4" cx="1010" cy="150" r="1.2"/>
  </g>

  <!-- лепестки сакуры -->
  <g fill="#ffb3d9" opacity="0.9">
    <use class="p1" href="#petal" transform="translate(150, -20)"/>
    <use class="p2" href="#petal" transform="translate(410, -40)"/>
    <use class="p3" href="#petal" transform="translate(690, -10)"/>
    <use class="p4" href="#petal" transform="translate(950, -30)"/>
    <use class="p5" href="#petal" transform="translate(1120, -50)"/>
  </g>
  <g fill="#ffd6ec" opacity="0.75">
    <use class="p2" href="#petal" transform="translate(270, -70) scale(0.85)"/>
    <use class="p4" href="#petal" transform="translate(560, -60) scale(0.8)"/>
    <use class="p1" href="#petal" transform="translate(830, -90) scale(0.9)"/>
    <use class="p3" href="#petal" transform="translate(1050, -75) scale(0.75)"/>
  </g>

  <!-- имя -->
  <g filter="url(#softText)" opacity="0.55">
    <text x="600" y="168" text-anchor="middle"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="76" font-weight="700" letter-spacing="2"
          fill="#ff9ecb">n1lokaDeep</text>
  </g>
  <text x="600" y="168" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="76" font-weight="700" letter-spacing="2"
        fill="url(#nameFill)">n1lokaDeep</text>

  <!-- разделитель -->
  <rect x="330" y="196" width="540" height="2" rx="1" fill="url(#lineFill)"/>

  <!-- подпись -->
  <text x="600" y="240" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="21" fill="#f3d9ea" opacity="0.95">
    пишу на Python · собираю шахматные движки · иногда молчу по-русски
  </text>
  <text x="600" y="278" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="15" fill="#c9b6e8" opacity="0.8" letter-spacing="4">
    PYTHON · ONNX · CHESS AI · STOCKFISH
  </text>
</svg>
